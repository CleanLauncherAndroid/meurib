name: Build APK and Publish Download Page

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-apk"
  cancel-in-progress: false

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compute GitHub Pages Public URL
        id: pages_url
        shell: bash
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            URL="https://${OWNER}.github.io/"
          else
            URL="https://${OWNER}.github.io/${REPO}/"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Public APK Download Page URL: $URL"

      - name: Ensure valid debug keystore
        shell: bash
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || rm -f debug.keystore
          fi
          if [ ! -f debug.keystore ] || ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkeypair -noprompt \
              -storetype JKS \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -sigalg SHA256withRSA \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Android SDK 36.1
        uses: android-actions/setup-android@v3

      - name: Install SDK 36.1 & Build Tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build Debug APK
        shell: bash
        run: |
          find apks -maxdepth 1 -type f -name "*.apk" -empty -delete 2>/dev/null || true
          gradle :app:assembleDebug \
            -PpublicShareUrl="${{ steps.pages_url.outputs.url }}" \
            --no-daemon

      - name: Prepare docs site with APK and icon
        shell: bash
        run: |
          mkdir -p docs
          APK_FILE="$(find apks -maxdepth 1 -type f -name "*.apk" | head -n 1 || true)"
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          fi
          cp -f "$APK_FILE" docs/muerib.apk
          if [ -f app/src/main/res/drawable/ic_launcher_muerib_clean.png ]; then
            cp -f app/src/main/res/drawable/ic_launcher_muerib_clean.png docs/icon.png
          fi
          ls -lh docs/

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: muerib-apk
          path: docs/muerib.apk

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release delete v1.0-latest --yes >/dev/null 2>&1 || true
          gh release create v1.0-latest docs/muerib.apk \
            --title "تطبيق معرب - أحدث نسخة APK" \
            --notes "صفحة التحميل المباشرة: ${{ steps.pages_url.outputs.url }}" || true

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
